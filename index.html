<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PokeCards do Bruno!</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://cdn.jsdelivr.net/npm/flowbite@4.0.1/dist/flowbite.min.css" rel="stylesheet" />
    <!-- <link rel="stylesheet" href="style.css"> -->
    <link rel="manifest" href="manifest.json">
</head>

<body class="bg-[url('https://i.pinimg.com/1200x/e4/8b/d5/e48bd581e26c652821d09d6e38468c31.jpg')] bg-cover bg-center bg-fixed bg-no-repeat min-h-screen text-white">
    <div id="toast-sucess"
        class="hidden z-50 flex items-center w-full max-w-xs p-4 text-body bg-neutral-primary-soft rounded-base shadow-xs border border-default"
        role="alert">
        <div class="inline-flex items-center justify-center shrink-0 w-8 h-8 text-green-500 bg-green-100 rounded-lg">
            ✅
        </div>
        <div id="toast-message" class="ms-3 text-sm font-normal">
            Pokemon salvo no deck!
        </div>
    </div>
    <div class="container mx-auto p-6">
        <h1 class="text-5xl font-bold text-center mb-8">PokeCards</h1>

        <div class="flex justify-center mb-8">
            <button id="openCard" class="bg-yellow-400 hover:bg-yellow-300 text-black font-bold py-3 px-6 rounded-xl text-xl transition">Abrir Cartinha</button>
        </div>
        <div class="flex justify-center mb-8">
            <button id="clearDeck" class="bg-red-500 hover:bg-red-400 text-white font-bold py-3 px-6 rounded-xl text-xl transition">Apagar meu deck</button>
        </div>

        <div id="card" class="flex justify-center mb-10"></div>
        <h2 class="text-3xl font-bold mb-5">Meu Deck</h2>
        <div id="default-modal" tabindex="-1" aria-hidden="true"
            class="hidden overflow-y-auto overflow-x-hidden fixed top-0 right-0 left-0 z-50 justify-center items-center w-full md:inset-0 h-[calc(100%-1rem)] max-h-full">
            <div class="relative p-4 w-full max-w-md max-h-full">
                <div class="relative bg-white rounded-lg shadow-sm">
                    <div class="flex items-center justify-between p-4 md:p-5 border-b rounded-t border-gray-200">
                        <h3 class="text-xl font-semibold text-gray-900">
                            Detalhes da Carta
                        </h3>
                        <button type="button"
                            class="text-gray-400 bg-transparent hover:bg-gray-200 hover:text-gray-900 rounded-lg text-sm w-8 h-8 ms-auto inline-flex justify-center items-center"
                            data-modal-hide="default-modal">
                            <svg class="w-3 h-3" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none"
                                viewBox="0 0 14 14">
                                <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"
                                    stroke-width="2" d="m1 1 6 6m0 0 6 6M7 7l6-6M7 7l-6 6" />
                            </svg>
                            <span class="sr-only">Fechar modal</span>
                        </button>
                    </div>

                    <div id="modal-content" class="p-0">
                    </div>
                </div>
            </div>
        </div>
        <div id="deck" class="grid grid-cols-1 md:grid-cols-3 lg:grid-cols-5 gap-4"></div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/flowbite@4.0.1/dist/flowbite.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/pouchdb@9.0.0/dist/pouchdb.min.js"></script>
    <script src="db.js"></script>
    <!-- <script type="module" src="app.js"></script> -->
    <script src="app.js"></script>
</body>

</html>
